name: artos-build
version: '0.1' # just for humans. Semantic versioning is recommended
summary: sdk for all build deps of ArtOS # 79 char long summary
description: |
  Installs the following packages into the workshop and adds i386 arch
  - cmake
  - wget
  - gcc-multilib
  - g++-multilib
  - libc6:i386
  - libstdc++6:i386
  - mtools
  - grub-common
  - grub-pc-bin
  - socat
  - xorriso
license: GPL-3.0
platforms:
  ubuntu@24.04:amd64:
parts:
  my-part:
    plugin: nil
